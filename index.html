<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLI Risk Indicator Dashboard</title>
<style>
  :root{
    --bg:#0f1417;
    --panel:#171d22;
    --panel-2:#1e262c;
    --line:#2a343b;
    --text:#e8edf0;
    --muted:#8aa0ab;
    --accent:#ff6a3d;
    --good:#3ddc97;
    --warn:#ffc857;
    --bad:#ff5d5d;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  h1{
    font-size:22px;
    margin:0;
    letter-spacing:0.5px;
    font-weight:700;
  }
  h1 span{color:var(--accent);}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input[type=text], select{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 12px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:13px;
  }
  button{
    background:var(--accent);
    color:#1a0e08;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
  }
  button:hover{opacity:0.85;}
  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
  }
  .card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .card .value{font-size:24px;font-weight:700;margin-top:6px;font-family:var(--mono);}
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    font-size:13px;
  }
  th,td{
    padding:10px 12px;
    text-align:left;
    border-bottom:1px solid var(--line);
  }
  th{
    background:var(--panel-2);
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    user-select:none;
  }
  th:hover{color:var(--text);}
  td.cli{font-family:var(--mono);}
  tr:hover td{background:rgba(255,255,255,0.03);}
  .bar-wrap{display:flex;align-items:center;gap:8px;}
  .bar{
    height:8px;
    border-radius:4px;
    background:var(--line);
    flex:1;
    overflow:hidden;
    min-width:60px;
  }
  .bar-fill{height:100%;border-radius:4px;}
  .pct{font-family:var(--mono);width:54px;text-align:right;}
  .risk-low{background:var(--good);}
  .risk-mid{background:var(--warn);}
  .risk-high{background:var(--bad);}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    font-family:var(--mono);
  }
  .badge-low{background:rgba(61,220,151,0.15);color:var(--good);}
  .badge-mid{background:rgba(255,200,87,0.15);color:var(--warn);}
  .badge-high{background:rgba(255,93,93,0.15);color:var(--bad);}
  .status{font-size:12px;color:var(--muted);margin-top:8px;}
  .chart-section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:20px;
  }
  .chart-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--muted);
  }
  .chart-wrap{
    display:flex;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
  }
  .chart-legend{
    display:flex;
    flex-direction:column;
    gap:10px;
    font-size:13px;
  }
  .legend-row{display:flex;align-items:center;gap:8px;}
  .legend-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
  .legend-label{color:var(--muted);min-width:90px;}
  .legend-val{font-family:var(--mono);font-weight:700;}
  footer{margin-top:30px;text-align:center;color:var(--muted);font-size:11px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>CLI Risk <span>Indicator</span></h1>
    <div class="sub">Outbound CLI risk percentage by attempt band</div>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search CLI...">
    <select id="campaignFilter">
      <option value="">All campaigns</option>
    </select>
    <select id="bandFilter">
      <option value="">All bands</option>
    </select>
    <button onclick="reload()">Reload data</button>
  </div>
</header>

<div class="summary">
  <div class="card"><div class="label">Total CLIs</div><div class="value" id="statCLIs">-</div></div>
  <div class="card"><div class="label">Total Attempts</div><div class="value" id="statAttempts">-</div></div>
  <div class="card"><div class="label">Avg Risk %</div><div class="value" id="statAvgRisk">-</div></div>
  <div class="card"><div class="label">High Risk Rows (&gt;25%)</div><div class="value" id="statHigh">-</div></div>
</div>

<div class="chart-section">
  <div class="chart-controls">
    <label for="chartCli">Risk breakdown for:</label>
    <select id="chartCli"></select>
  </div>
  <div class="chart-wrap">
    <canvas id="riskDoughnut" width="220" height="220"></canvas>
    <div class="chart-legend" id="chartLegend"></div>
  </div>
</div>

<table id="dataTable">
  <thead>
    <tr>
      <th data-key="campaign_name">Campaign</th>
      <th data-key="outbound_cli">CLI</th>
      <th data-key="attempt_band">Attempt Band</th>
      <th data-key="attempts">Attempts</th>
      <th data-key="risk_pct">Risk %</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="status" id="status"></div>

<footer>
  Ison Xperiences · CLI Risk Indicator Dashboard
</footer>

<script>
// ---- CONFIG ----
// Point this at the raw GitHub URL of your CSV, e.g.
// https://raw.githubusercontent.com/<user>/<repo>/main/CLI_Risk_Indicator.csv
const CSV_URL = "https://raw.githubusercontent.com/I50N/CLI_Risk_Indicator/refs/heads/main/CLI_Risk_Indicator.csv";

// Embedded fallback data (used if CSV_URL is empty or fetch fails)
const FALLBACK_CSV = `campaign_name,outbound_cli,attempt_band,attempts,risk_pct
Device Insurance,+27770977254,1,72,0.00
Device Insurance,+27770977254,10+,12,0.00
Device Insurance,+27770977254,2-3,246,15.04
Device Insurance,+27770977254,4-5,691,6.37
Device Insurance,+27770977254,6-10,3906,28.83
Device Insurance,+27872848841,1,68,0.00
Device Insurance,+27872848841,10+,3,0.00
Device Insurance,+27872848841,2-3,240,17.50
Device Insurance,+27872848841,4-5,715,6.99
Device Insurance,+27872848841,6-10,3972,37.29
Device Insurance,Unknown,1,23,0.00
Device Insurance,Unknown,10+,165,0.00
Device Insurance,Unknown,2-3,17,0.00
Device Insurance,Unknown,4-5,9,0.00
Device Insurance,Unknown,6-10,37,0.00`;

let rows = [];
let sortKey = null;
let sortDir = 1;

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.replace(/^"|"$/g,'').trim());
    const obj = {};
    headers.forEach((h,i) => obj[h] = vals[i]);
    obj.outbound_cli = obj.outbound_cli === '\\0' ? 'Unknown' : obj.outbound_cli;
    obj.attempts = parseInt(obj.attempts) || 0;
    obj.risk_pct = parseFloat(obj.risk_pct) || 0;
    return obj;
  });
}

function riskClass(pct){
  if(pct >= 25) return 'high';
  if(pct >= 10) return 'mid';
  return 'low';
}

function populateCampaignFilter(){
  const campaigns = [...new Set(rows.map(r => r.campaign_name))];
  const sel = document.getElementById('campaignFilter');
  sel.innerHTML = '<option value="">All campaigns</option>' +
    campaigns.map(c => `<option value="${c}">${c}</option>`).join('');
}

function populateBandFilter(){
  const bands = [...new Set(rows.map(r => r.attempt_band))];
  const order = ['1','2-3','4-5','6-10','10+'];
  bands.sort((a,b) => order.indexOf(a) - order.indexOf(b));
  const sel = document.getElementById('bandFilter');
  sel.innerHTML = '<option value="">All bands</option>' +
    bands.map(b => `<option value="${b}">${b}</option>`).join('');
}

function populateChartCli(){
  const clis = [...new Set(rows.map(r => r.outbound_cli))];
  const sel = document.getElementById('chartCli');
  const prev = sel.value;
  sel.innerHTML = clis.map(c => `<option value="${c}">${c}</option>`).join('');
  if(clis.includes(prev)) sel.value = prev;
}

function drawDoughnut(){
  const cli = document.getElementById('chartCli').value;
  const data = rows.filter(r => r.outbound_cli === cli);

  const totalAttempts = data.reduce((s,r) => s + r.attempts, 0);
  const riskyAttempts = data.reduce((s,r) => s + r.attempts * (r.risk_pct/100), 0);
  const normalAttempts = totalAttempts - riskyAttempts;

  const riskyPct = totalAttempts > 0 ? (riskyAttempts/totalAttempts*100) : 0;
  const normalPct = 100 - riskyPct;

  const canvas = document.getElementById('riskDoughnut');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  const cx = w/2, cy = h/2, rOuter = 90, rInner = 55;
  let startAngle = -Math.PI/2;

  const segments = [
    { value: riskyPct, color: '#ff5d5d', label: 'Risky outcomes' },
    { value: normalPct, color: '#3ddc97', label: 'Normal outcomes' }
  ];

  segments.forEach(seg => {
    const angle = (seg.value/100) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,startAngle,startAngle+angle);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    startAngle += angle;
  });

  // cut out center
  ctx.beginPath();
  ctx.arc(cx,cy,rInner,0,Math.PI*2);
  ctx.fillStyle = '#171d22';
  ctx.fill();

  // center text
  ctx.fillStyle = '#e8edf0';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(riskyPct.toFixed(1)+'%', cx, cy-8);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#8aa0ab';
  ctx.fillText('risky', cx, cy+12);

  // legend
  const legend = document.getElementById('chartLegend');
  legend.innerHTML = segments.map(seg => `
    <div class="legend-row">
      <div class="legend-swatch" style="background:${seg.color}"></div>
      <div class="legend-label">${seg.label}</div>
      <div class="legend-val">${seg.value.toFixed(2)}%</div>
    </div>
  `).join('') + `
    <div class="legend-row">
      <div class="legend-swatch" style="background:transparent"></div>
      <div class="legend-label">Total attempts</div>
      <div class="legend-val">${totalAttempts.toLocaleString()}</div>
    </div>
  `;
}

function render(){
  const search = document.getElementById('search').value.toLowerCase();
  const band = document.getElementById('bandFilter').value;
  const campaign = document.getElementById('campaignFilter').value;

  let filtered = rows.filter(r =>
    r.outbound_cli.toLowerCase().includes(search) &&
    (band === '' || r.attempt_band === band) &&
    (campaign === '' || r.campaign_name === campaign)
  );

  if(sortKey){
    filtered.sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if(typeof av === 'string'){ av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if(av < bv) return -1 * sortDir;
      if(av > bv) return 1 * sortDir;
      return 0;
    });
  }

  const tbody = document.querySelector('#dataTable tbody');
  tbody.innerHTML = filtered.map(r => {
    const cls = riskClass(r.risk_pct);
    return `<tr>
      <td>${r.campaign_name}</td>
      <td class="cli">${r.outbound_cli}</td>
      <td>${r.attempt_band}</td>
      <td>${r.attempts.toLocaleString()}</td>
      <td>
        <div class="bar-wrap">
          <div class="bar"><div class="bar-fill risk-${cls}" style="width:${Math.min(r.risk_pct,100)}%"></div></div>
          <span class="pct">${r.risk_pct.toFixed(2)}%</span>
          <span class="badge badge-${cls}">${cls.toUpperCase()}</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  updateSummary(filtered);
  populateChartCli();
  drawDoughnut();
}

function updateSummary(data){
  const clis = new Set(data.map(r => r.outbound_cli));
  const totalAttempts = data.reduce((s,r) => s + r.attempts, 0);
  const weightedRisk = totalAttempts > 0
    ? data.reduce((s,r) => s + r.attempts * r.risk_pct, 0) / totalAttempts
    : 0;
  const highCount = data.filter(r => r.risk_pct > 25).length;

  document.getElementById('statCLIs').textContent = clis.size;
  document.getElementById('statAttempts').textContent = totalAttempts.toLocaleString();
  document.getElementById('statAvgRisk').textContent = weightedRisk.toFixed(2) + '%';
  document.getElementById('statHigh').textContent = highCount;
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = isError ? 'var(--bad)' : 'var(--muted)';
}

async function reload(){
  if(!CSV_URL){
    rows = parseCSV(FALLBACK_CSV);
    setStatus('Loaded embedded data (set CSV_URL to load live from GitHub).');
    populateCampaignFilter();
    populateBandFilter();
    render();
    return;
  }
  setStatus('Loading from ' + CSV_URL + ' ...');
  try{
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    rows = parseCSV(text);
    setStatus('Loaded ' + rows.length + ' rows from GitHub at ' + new Date().toLocaleTimeString());
    populateCampaignFilter();
    populateBandFilter();
    render();
  }catch(err){
    rows = parseCSV(FALLBACK_CSV);
    setStatus('Could not load CSV_URL (' + err.message + '). Showing embedded fallback data.', true);
    populateCampaignFilter();
    populateBandFilter();
    render();
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('campaignFilter').addEventListener('change', render);
document.getElementById('chartCli').addEventListener('change', drawDoughnut);
document.getElementById('bandFilter').addEventListener('change', render);

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = 1; }
    render();
  });
});

reload();
</script>

</body>
</html>
